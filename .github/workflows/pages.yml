name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate M3U playlists
        run: python3 tools/build_playlists.py

      - name: Assemble site
        # Only the files the browser needs - never .git, .github or tools/.
        run: |
          mkdir -p _site
          cp -r index.html player.html sw.js manifest.webmanifest \
                playlist.m3u playlist_web.m3u data assets _site/
          touch _site/.nojekyll
          echo "--- publishing ---"
          find _site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
